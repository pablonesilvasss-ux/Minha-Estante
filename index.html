<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Minha Estante</title>
<style>
:root{--bg:#050505;--panel:#171717;--panel2:#202020;--text:#f5f5f5;--muted:#aaa;--line:#383838;--yellow:#ffca05;--yellow2:#f2b900;--danger:#ff5d5d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,'Arial',sans-serif;min-height:100dvh}body.light{--bg:#f6f4ed;--panel:#fff;--panel2:#f0eee7;--text:#181818;--muted:#686868;--line:#dedbd0}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100dvh;padding:18px 16px 92px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}.brand{display:flex;align-items:center;gap:10px;color:var(--yellow);font-weight:900;font-size:24px;letter-spacing:-.7px}.brand svg{width:32px;height:32px;fill:currentColor}.greeting{font-size:13px;color:var(--muted);margin:-8px 2px 16px}.greeting strong{color:var(--yellow)}.iconbtn{width:42px;height:42px;border-radius:15px;background:var(--panel);color:var(--yellow);font-size:21px;border:1px solid var(--line)}.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:0 15px;margin-bottom:17px}.search span{color:var(--yellow);font-size:22px}.search input{background:transparent;color:var(--text);border:0;outline:0;width:100%;padding:15px 0;font-size:15px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}.tab{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:17px;padding:13px 5px;font-size:13px;font-weight:700;min-height:64px}.tab .sym{display:block;color:var(--yellow);font-size:18px;margin-bottom:5px}.tab.active{background:var(--yellow);color:#111;border-color:var(--yellow)}.tab.active .sym{color:#111}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}.sectionhead h2{font-size:16px;margin:0}.count{color:var(--muted);font-size:12px}.books{display:flex;flex-direction:column;gap:11px}.book{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid transparent;border-radius:19px;padding:10px;min-height:120px;position:relative}.cover{width:84px;height:106px;flex-shrink:0;border-radius:12px;background:linear-gradient(145deg,#3b3212,#17130a);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--yellow);border:1px solid #494018}.cover img{width:100%;height:100%;object-fit:cover}.cover .pdficon{font-size:35px}.bookinfo{min-width:0;flex:1}.booktitle{font-weight:800;font-size:15px;line-height:1.3;overflow-wrap:anywhere;margin-bottom:5px}.author{font-size:12px;color:var(--muted);margin-bottom:14px}.progressrow{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text)}.progress{height:6px;border-radius:20px;background:var(--line);overflow:hidden;flex:1}.progress i{display:block;height:100%;background:var(--yellow);border-radius:20px}.more{background:transparent;color:var(--yellow);font-size:24px;padding:5px 8px;align-self:flex-start}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty .big{font-size:45px;color:var(--yellow);margin-bottom:12px}.empty strong{display:block;color:var(--text);margin-bottom:8px}.fab{position:fixed;bottom:24px;right:max(22px,calc((100vw - 760px)/2 + 20px));width:58px;height:58px;border-radius:20px;background:var(--yellow);color:#111;font-size:32px;box-shadow:0 6px 24px #0008}.nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:clamp(35px,12vw,100px);padding:10px 12px max(10px,env(safe-area-inset-bottom));z-index:3}.nav button{background:transparent;color:var(--muted);font-size:11px;display:flex;align-items:center;flex-direction:column;gap:4px}.nav button b{font-size:20px}.nav button.active{color:var(--yellow)}.modalback{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(100%,560px);background:var(--panel);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:22px 18px max(24px,env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.modal h2{margin:0 0 5px;font-size:19px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.action{display:flex;align-items:center;gap:13px;width:100%;padding:15px 12px;margin-top:8px;border-radius:15px;background:var(--panel2);color:var(--text);text-align:left}.action .aicon{font-size:19px;color:var(--yellow);width:27px;text-align:center}.action.danger{color:var(--danger)}.close{float:right;background:var(--panel2);color:var(--text);border-radius:12px;padding:8px 12px}.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}.readerhead{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}.back{background:var(--yellow);color:#111;border-radius:14px;padding:11px 13px;font-weight:700}.readertitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.readerbody{flex:1;overflow:auto;padding:18px 15px 30px;display:flex;justify-content:center;align-items:flex-start}.pdfpage{max-width:100%;height:auto;box-shadow:0 4px 25px #0008}.readerfoot{border-top:1px solid var(--line);padding:10px 14px 15px;display:flex;align-items:center;gap:10px}.readerfoot button{background:var(--panel);color:var(--yellow);border:1px solid var(--line);border-radius:13px;padding:10px 14px}.readerfoot .pageno{flex:1;text-align:center;font-size:12px;color:var(--muted)}.settingsrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.pill{border-radius:14px;padding:12px 16px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}.pill.selected{background:var(--yellow);color:#111;border-color:var(--yellow)}.settinglabel{font-size:13px;color:var(--muted);margin-top:18px}.settingselect{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:12px;border-radius:13px;width:100%;margin-top:8px}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#111;padding:12px 18px;border-radius:15px;z-index:50;font-size:13px;font-weight:700;box-shadow:0 5px 20px #0006}.hidden{display:none!important}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}
</style>
</head>
<body><main class="app" id="home"><header class="top"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M18 35V15C10 6 2 11 2 11v18c7-4 12-1 16 6Zm4 0V15c8-9 16-4 16-4v18c-7-4-12-1-16 6ZM20 14C10 11 13 1 20 5c7-4 10 6 0 9Z"/></svg>Minha Estante</div><button class="iconbtn" id="settingsBtn" aria-label="Configurações">⚙</button></header><div class="greeting" id="greeting">Olá! Que bom ter você por aqui.</div><label class="search"><span>⌕</span><input id="search" placeholder="Pesquisar livros pelo título..." autocomplete="off"></label><div class="tabs" id="tabs"><button class="tab active" data-tab="reading"><span class="sym">▣</span>EM LEITURA</button><button class="tab" data-tab="shelf"><span class="sym">▮</span>MINHA ESTANTE</button><button class="tab" data-tab="read"><span class="sym">✓</span>JÁ LIDOS</button></div><div class="sectionhead"><h2 id="sectionTitle">Em leitura</h2><span class="count" id="count">0 livros</span></div><section class="books" id="books"></section></main><button class="fab" id="addBtn" aria-label="Adicionar livro">+</button><nav class="nav"><button class="active" id="navHome"><b>⌂</b>Início</button><button id="navSearch"><b>⌕</b>Pesquisar</button><button id="navMore"><b>☰</b>Mais</button></nav><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);const DB='minha-estante-v1';let books=[],tab='reading',query='',activeBook=null,pdfDoc=null,pageNum=1,readerScale=1,readerFont='Georgia';let db;
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function dbPut(b){return new Promise((res,rej)=>{let t=db.transaction('books','readwrite');t.objectStore('books').put(b);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function dbDelete(id){return new Promise((res,rej)=>{let t=db.transaction('books','readwrite');t.objectStore('books').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function dbAll(){return new Promise((res,rej)=>{let r=db.transaction('books').objectStore('books').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showToast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}const tabNames={reading:'Em leitura',shelf:'Minha Estante',read:'Já lidos'};
function render(){let arr=books.filter(b=>b.status===tab&&(!query||b.title.toLowerCase().includes(query.toLowerCase())||(b.author||'').toLowerCase().includes(query.toLowerCase())));$('#sectionTitle').textContent=tabNames[tab];$('#count').textContent=arr.length+(arr.length===1?' livro':' livros');$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('#books').innerHTML=arr.length?arr.map(b=>`<article class="book" data-id="${b.id}"><div class="cover">${b.cover?`<img src="${b.cover}" alt="Capa de ${esc(b.title)}">`:'<span class="pdficon">▤</span>'}</div><div class="bookinfo"><div class="booktitle">${esc(b.title)}</div><div class="author">${esc(b.author||'PDF • Autor não informado')}</div><div class="progressrow"><div class="progress"><i style="width:${b.status==='read'?100:(b.progress||0)}%"></i></div><b>${b.status==='read'?100:(b.progress||0)}%</b></div></div><button class="more" data-menu="${b.id}" aria-label="Opções do livro">⋮</button></article>`).join(''):`<div class="empty"><div class="big">${query?'⌕':'▤'}</div><strong>${query?'Nenhum livro encontrado':'Sua estante começa aqui'}</strong><span>${query?'Tente outro título ou autor.':'Toque no + para importar seu primeiro PDF.'}</span></div>`;}
function modal(html){$('#overlay').innerHTML=`<div class="modalback" id="modalback"><section class="modal">${html}</section></div>`;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()})}function closeModal(){$('#overlay').innerHTML=''}function bookMenu(id){let b=books.find(x=>x.id===id);if(!b)return;activeBook=b;modal(`<button class="close" onclick="closeModal()">✕</button><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author||'Documento PDF')}</div><button class="action" onclick="openBook('${id}')"><span class="aicon">▹</span>Continuar lendo</button><button class="action" onclick="moveBook('${id}')"><span class="aicon">⇄</span>Mover para outra aba</button><button class="action" onclick="markRead('${id}')"><span class="aicon">✓</span>${b.status==='read'?'Voltar para Minha Estante':'Marcar como lido'}</button><button class="action" onclick="editTitle('${id}')"><span class="aicon">✎</span>Editar título e autor</button><button class="action danger" onclick="deleteBook('${id}')"><span class="aicon">♲</span>Excluir da estante</button>`)}function moveBook(id){let b=books.find(x=>x.id===id);modal(`<button class="close" onclick="closeModal()">✕</button><h2>Mover para...</h2><div class="sub">Escolha em qual aba o livro deve aparecer.</div>${Object.entries(tabNames).map(([k,v])=>`<button class="action" onclick="setStatus('${id}','${k}')"><span class="aicon">${k===b.status?'●':'○'}</span>${v}</button>`).join('')}`)}async function setStatus(id,s){let b=books.find(x=>x.id===id);b.status=s;if(s==='read')b.progress=100;await dbPut(b);closeModal();render();showToast('Livro movido!')}async function markRead(id){let b=books.find(x=>x.id===id);await setStatus(id,b.status==='read'?'shelf':'read')}async function deleteBook(id){if(!confirm('Excluir este livro da sua estante?'))return;await dbDelete(id);books=books.filter(x=>x.id!==id);closeModal();render();showToast('Livro excluído')}function editTitle(id){let b=books.find(x=>x.id===id);modal(`<button class="close" onclick="closeModal()">✕</button><h2>Editar informações</h2><div class="settinglabel">Título</div><input id="editTitle" class="settingselect" value="${esc(b.title)}"><div class="settinglabel">Autor</div><input id="editAuthor" class="settingselect" value="${esc(b.author||'')}"><button class="action" onclick="saveEdit('${id}')"><span class="aicon">✓</span>Salvar alterações</button>`)}async function saveEdit(id){let b=books.find(x=>x.id===id);b.title=$('#editTitle').value.trim()||b.title;b.author=$('#editAuthor').value.trim();await dbPut(b);closeModal();render()}
async function importPDF(file){if(!file||file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){showToast('Escolha um arquivo PDF.');return}showToast('Importando PDF...');let buf=await file.arrayBuffer();let b={id:crypto.randomUUID(),title:file.name.replace(/\.pdf$/i,''),author:'',status:'shelf',progress:0,page:1,totalPages:0,data:buf,cover:null,created:Date.now()};try{let pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;b.totalPages=pdf.numPages;let p=await pdf.getPage(1),vp=p.getViewport({scale:.35}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;b.cover=canvas.toDataURL('image/jpeg',.7);await pdf.destroy()}catch(e){console.warn(e)}await dbPut(b);books.unshift(b);render();showToast('PDF adicionado à sua estante!')}
function addBook(){modal(`<button class="close" onclick="closeModal()">✕</button><h2>Adicionar livro</h2><div class="sub">Importe um PDF salvo no seu celular. A cópia fica armazenada neste dispositivo.</div><label class="action" style="cursor:pointer"><span class="aicon">＋</span><span>Selecionar arquivo PDF<input id="filePick" type="file" accept="application/pdf,.pdf" hidden></span></label><div class="hint">Dica: o nome do arquivo será usado como título. Depois, toque nos três pontinhos do livro para editar as informações e mover entre as abas.</div>`);$('#filePick').onchange=async e=>{let f=e.target.files[0];closeModal();if(f)await importPDF(f)}}
function openBook(id){let b=books.find(x=>x.id===id);if(!b)return;activeBook=b;pageNum=b.page||1;closeModal();$('#overlay').innerHTML=`<div class="reader" id="reader"><header class="readerhead"><button class="back" id="exitReader">‹ Sair</button><div class="readertitle">${esc(b.title)}</div><button class="iconbtn" id="readSettings">Aa</button></header><div class="readerbody" id="readerbody"><div class="empty">Abrindo livro...</div></div><footer class="readerfoot"><button id="prevPage">‹</button><span class="pageno" id="pageno"></span><button id="nextPage">›</button></footer></div>`;$('#exitReader').onclick=()=>{saveProgress();$('#overlay').innerHTML='';render()};$('#readSettings').onclick=readerSettings;$('#prevPage').onclick=()=>goPage(-1);$('#nextPage').onclick=()=>goPage(1);loadPage()}
async function loadPage(){let b=activeBook;try{if(!window.pdfjsLib)throw Error('PDF.js não carregou');pdfDoc=await pdfjsLib.getDocument({data:b.data.slice(0)}).promise;b.totalPages=pdfDoc.numPages;await drawPage()}catch(e){$('#readerbody').innerHTML='<div class="empty"><div class="big">!</div><strong>Não foi possível abrir este PDF</strong><span>Verifique se o arquivo é válido e tente importá-lo novamente.</span></div>';console.error(e)}}async function drawPage(){if(!pdfDoc)return;let p=await pdfDoc.getPage(pageNum),scale=Math.min((window.innerWidth-30)/p.getViewport({scale:1}).width,1.7)*readerScale,vp=p.getViewport({scale}),c=document.createElement('canvas');c.className='pdfpage';c.width=vp.width*devicePixelRatio;c.height=vp.height*devicePixelRatio;c.style.width=vp.width+'px';c.style.height=vp.height+'px';let ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);await p.render({canvasContext:ctx,viewport:vp}).promise;$('#readerbody').innerHTML='';$('#readerbody').appendChild(c);$('#readerbody').scrollTop=0;$('#pageno').textContent=`${pageNum} de ${pdfDoc.numPages} páginas`;activeBook.page=pageNum;activeBook.totalPages=pdfDoc.numPages;activeBook.progress=Math.round(pageNum/pdfDoc.numPages*100);dbPut(activeBook);}
function goPage(d){if(!pdfDoc)return;pageNum=Math.max(1,Math.min(pdfDoc.numPages,pageNum+d));drawPage()}function saveProgress(){if(activeBook){activeBook.page=pageNum;dbPut(activeBook)}}function readerSettings(){modal(`<button class="close" onclick="closeModal()">✕</button><h2>Personalizar leitura</h2><div class="settinglabel">Fonte</div><div class="settingsrow">${['Roboto','Georgia','Arial','Verdana','Times New Roman','Courier New'].map(f=>`<button class="pill ${readerFont===f?'selected':''}" style="font-family:'${f}'" onclick="setFont('${f}')">${f}</button>`).join('')}</div><div class="settinglabel">Tamanho da fonte / visualização</div><div class="settingsrow">${[['25%',.75],['50%',1],['100%',1.25]].map(([l,v])=>`<button class="pill ${readerScale===v?'selected':''}" onclick="setReaderScale(${v})">${l}</button>`).join('')}</div><div class="hint">Ajuste a visualização do PDF. O tamanho real do texto pode depender de como o documento foi criado.</div>`)}function setFont(f){readerFont=f;readerSettings()}function setReaderScale(v){readerScale=v;readerSettings();drawPage()}
function settings(){let nick=localStorage.getItem('me-nickname')||'';modal(`<button class="close" onclick="closeModal()">✕</button><h2>Personalizar aplicativo</h2><div class="sub">Sem conta e sem cadastro: escolha apenas como quer ser chamado.</div><div class="settinglabel">Seu apelido</div><input id="nicknameInput" class="settingselect" maxlength="30" placeholder="Como quer ser chamado?" value="${esc(nick)}"><button class="action" onclick="saveNickname()"><span class="aicon">✓</span>Salvar apelido</button><div class="settinglabel">Aparência</div><div class="settingsrow"><button class="pill ${!document.body.classList.contains('light')?'selected':''}" onclick="setTheme('dark')">● Modo escuro</button><button class="pill ${document.body.classList.contains('light')?'selected':''}" onclick="setTheme('light')">☼ Modo claro</button></div><div class="settinglabel">Sobre o aplicativo</div><div class="hint">Minha Estante · versão inicial<br>Seu apelido, PDFs e progresso ficam armazenados localmente neste dispositivo. Não é necessário criar conta.</div>`)}function saveNickname(){let nick=$('#nicknameInput').value.trim().slice(0,30);if(nick)localStorage.setItem('me-nickname',nick);else localStorage.removeItem('me-nickname');updateGreeting();settings();showToast(nick?'Apelido salvo!':'Apelido removido')}function updateGreeting(){let nick=localStorage.getItem('me-nickname')||'';$('#greeting').innerHTML=nick?`Olá, <strong>${esc(nick)}</strong>! Vamos continuar sua leitura?`:'Olá! Que bom ter você por aqui.'}function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem('me-theme',t);settings()}
$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('#search').oninput=e=>{query=e.target.value;render()};$('#settingsBtn').onclick=settings;$('#addBtn').onclick=addBook;$('#navSearch').onclick=()=>{$('#search').focus();window.scrollTo({top:0,behavior:'smooth'})};$('#navHome').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});tab='reading';render()};$('#navMore').onclick=settings;$('#books').onclick=e=>{let m=e.target.closest('[data-menu]');if(m){bookMenu(m.dataset.menu);return}let c=e.target.closest('.book');if(c)bookMenu(c.dataset.id)};let pressTimer;$('#books').addEventListener('touchstart',e=>{let c=e.target.closest('.book');if(c){pressTimer=setTimeout(()=>bookMenu(c.dataset.id),650)}},{passive:true});['touchend','touchmove'].forEach(ev=>$('#books').addEventListener(ev,()=>clearTimeout(pressTimer),{passive:true}));
(async()=>{if(localStorage.getItem('me-theme')==='light')document.body.classList.add('light');updateGreeting();try{await openDB();books=await dbAll();render()}catch(e){console.error(e);showToast('Não foi possível iniciar o armazenamento local.')}})();
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
</body></html>
